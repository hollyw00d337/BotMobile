# Configuration for Rasa - Optimized for faster training
recipe: default.v1
language: es

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb  # Mejora para palabras parciales
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 30  # Aumentado para mejor comprensión
  constrain_similarities: true
  entity_recognition: true
  intent_classification: true
  dropout_rate: 0.1
  learning_rate: 0.001
- name: EntitySynonymMapper
- name: RegexEntityExtractor
  use_lookup_tables: true  # ✅ Activado para usar lookup tables
  use_regexes: true
  use_word_boundaries: true
- name: FallbackClassifier
  threshold: 0.7  # Mejora detección de intents poco claros
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: TEDPolicy
  max_history: 5
  epochs: 50

# Configuración de sesión
session_config:
  session_expiration_time: 60  # 60 minutos
  carry_over_slots_to_new_session: true

assistant_id: spotybot-mobile-v1
