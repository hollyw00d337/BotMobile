    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom

  referencia_pago:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom

  tipo_pago:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
      - type: custom

  metodo_pago:
    type: text
    initial_value: null
    influence_conversation: false
    mappings:
