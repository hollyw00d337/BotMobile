version: "3.1"

stories:

# Conversación base: arranque y primer enrutamiento
- story: Inicio de conversación
  steps:
    - intent: saludar
    - action: action_session_start

# Muestras mínimas de navegación por número
- story: Selección en menú principal
  steps:
    - slot_was_set:
        - estado_menu: "menu_principal"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

# Texto libre en estados clave → router (el router delega a la acción correcta)
- story: Texto libre en capturar_nip
  steps:
    - slot_was_set:
        - estado_menu: "capturar_nip"
    - intent: informar
    - action: action_elegir_opcion

- story: Texto libre en validar_imei
  steps:
    - slot_was_set:
        - estado_menu: "validar_imei"
    - intent: informar
    - action: action_elegir_opcion

# Detección automática de compañía (Node-RED)
- story: Detección de compañía desde Node-RED
  steps:
    - intent: informar_compania
    - action: action_procesar_compania

# Historia de navegación por submenús
- story: Navegación por submenús
  steps:
    - slot_was_set:
        - estado_menu: "submenu_portabilidad"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

- story: Navegación por paquetes
  steps:
    - slot_was_set:
        - estado_menu: "submenu_paquetes"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

# Nuevas stories para flujo Node-RED
- story: Inicio de flujo desde Node-RED
  steps:
    - intent: iniciar_flujo
    - action: action_manejar_inicio_flujo

- story: Fin de flujo desde Node-RED
  steps:
    - intent: finalizar_flujo
    - action: action_manejar_fin_flujo

- story: Respuesta a botones
  steps:
    - intent: respuesta_boton
    - action: action_respuesta_botones

- story: Flujo completo Node-RED
  steps:
    - intent: iniciar_flujo
    - action: action_manejar_inicio_flujo
    - intent: respuesta_boton
    - action: action_respuesta_botones
    - intent: finalizar_flujo
    - action: action_manejar_fin_flujo
