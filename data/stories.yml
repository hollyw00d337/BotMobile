version: "3.1"

stories:

# Conversación base: arranque y primer enrutamiento
- story: Inicio de conversación
  steps:
    - intent: saludar
    - action: action_session_start

# Muestras mínimas de navegación por número
- story: Selección en menú principal
  steps:
    - slot_was_set:
        - estado_menu: "menu_principal"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

# Texto libre en estados clave → router (el router delega a la acción correcta)
- story: Texto libre en capturar_nip
  steps:
    - slot_was_set:
        - estado_menu: "capturar_nip"
    - intent: informar
    - action: action_elegir_opcion

- story: Texto libre en validar_imei
  steps:
    - slot_was_set:
        - estado_menu: "validar_imei"
    - intent: informar
    - action: action_elegir_opcion

# Detección automática de compañía (Node-RED)
- story: Detección de compañía desde Node-RED
  steps:
    - intent: informar_compania
    - action: action_procesar_compania

# Historia de navegación por submenús
- story: Navegación por submenús
  steps:
    - slot_was_set:
        - estado_menu: "submenu_portabilidad"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

- story: Navegación por paquetes
  steps:
    - slot_was_set:
        - estado_menu: "submenu_paquetes"
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

# Historias para intents específicos
- story: Usuario quiere portabilidad directamente
  steps:
    - intent: portabilidad_interes
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "portabilidad"

- story: Usuario pregunta por planes directamente
  steps:
    - intent: planes_interes
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "paquetes"

- story: Usuario quiere contacto directo
  steps:
    - intent: contacto_interes
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "contacto"

# Manejo de confirmaciones y negaciones
- story: Usuario confirma información
  steps:
    - intent: confirmar
    - action: action_elegir_opcion

- story: Usuario niega o rechaza
  steps:
    - intent: negar
    - action: action_elegir_opcion

# Regreso al menú desde cualquier estado
- story: Regreso al menú desde portabilidad
  steps:
    - slot_was_set:
        - estado_menu: "portabilidad"
    - intent: regresar_menu
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "menu_principal"

- story: Regreso al menú desde paquetes
  steps:
    - slot_was_set:
        - estado_menu: "paquetes"
    - intent: regresar_menu
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "menu_principal"

- story: Regreso al menú desde contacto
  steps:
    - slot_was_set:
        - estado_menu: "contacto"
    - intent: regresar_menu
    - action: action_elegir_opcion
    - slot_was_set:
        - estado_menu: "menu_principal"
