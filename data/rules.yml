version: "3.1"

rules:

- rule: Iniciar sesión
  steps:
    - intent: saludar
    - action: action_session_start

- rule: Procesar mensaje de Node-RED con compañía
  steps:
    - intent: informar_compania
    - action: action_procesar_compania

- rule: Regresar al menú principal
  steps:
    - intent: regresar_menu
    - action: action_elegir_opcion

- rule: Despedida
  steps:
    - intent: despedida
    - action: utter_despedida

- rule: Seleccionar opción → Router
  steps:
    - intent: seleccionar_opcion
    - action: action_elegir_opcion

- rule: Texto libre → Router
  steps:
    - intent: informar
    - action: action_elegir_opcion
