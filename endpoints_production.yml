# Endpoints de producción para BotMobile
# Configuración simplificada sin Redis

# Action endpoint para acciones customizadas
action_endpoint:
  url: "http://botmobile-actions:5055/webhook"

# Node-RED Integration endpoint
# Endpoint para recibir webhooks desde Node-RED
rest:
  # El webhook de Node-RED enviará requests a: /webhooks/rest/webhook

# Tracker store - En memoria (sin persistencia)
# Las conversaciones se almacenan en memoria y se pierden al reiniciar
# tracker_store:
#   type: InMemoryTrackerStore

# Event broker - Deshabilitado (sin analytics)
# event_broker:

# Lock store - En memoria (sin sincronización externa)
# lock_store:

# Modelo de NLU (si usas servidor externo)
# nlg:
#   url: "http://localhost:5002/nlg"

# Para debugging en producción (opcional)
# model_endpoint:
#   url: "http://localhost:5005/model"
#   wait_time_between_pulls: 10